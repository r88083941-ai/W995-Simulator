
name: Build W995 Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'W995Simulator-Android-Starter-v0.3.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q W995Simulator-Android-Starter-v0.3.zip -d source
          test -f source/W995Simulator/settings.gradle.kts

      - name: Build APK
        working-directory: source/W995Simulator
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: W995-Simulator-APK
          path: source/W995Simulator/app/build/outputs/apk/debug/app-debug.apk
